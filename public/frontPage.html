<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes app</title>
</head>
<body>
  <button id="delete-all-notes">Delete Notes</button>
  

  <input type="text" id="note-title" placeholder="Title">
  <input type="text" id="note-content" placeholder="Content">
  <button id="create-notes">Create Note</button>

  <input type="text" id="delete-singular" placeholder="Delete note id">
  <button id="delete-singular-button">Delete singular</button>

  <input type="text" id="search-notes" placeholder="search for notes">

  <button id="filter-favorite">Filter favorite</button>

  <input type="text" id="id-to-update" placeholder="id to update">
  <input type="text" id="update-title" placeholder="update title">
  <input type="text" id="update-content" placeholder="update content">
  <button id="update-note">Update</button>

  <button id="next-page">next</button>
  <button id="previous-page">previous</button>

  <input type="text" id="signup-username" placeholder="sign up username">
  <input type="text" id="signup-password" placeholder="sign up password">
  <button id="signup-button">Sign up</button>

  <input type="text" id="login-username" placeholder="login username">
  <input type="text" id="login-password" placeholder="login password">
  <button id="login-button">Login</button>

<p id="username-text">Username: not logged in</p>
</body>

<body>
    <div id="notes"></div>
</body>

<script src="client.js"></script>

</html>
