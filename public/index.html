<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes app</title>
</head>

<body>

  <div style="display: flex; justify-content: space-between;">

    <!-- LEFT SIDE -->
    <div>

      <h1>Notes App</h1>

      <h2>Create Note</h2>

      <input type="text" id="note-title" placeholder="Title" style="width: 300px;">
      <br><br>

      <textarea id="note-content" placeholder="Content" rows="8" cols="60"></textarea>
      <br><br>

      <button id="create-notes">Create Note</button>


      <h2>Find Notes</h2>

      <input type="text" id="search-notes" placeholder="Search for notes" style="width: 300px;">
      <button id="filter-favorite">Filter Favorite</button>


      <h2>Your Notes</h2>

      <div id="notes"></div>

    </div>


    <!-- RIGHT SIDE -->
    <div style="text-align: right;">

      <h1 style="margin-top: 21px;">Account</h1>

      <p id="username-text">Username: not logged in</p>

      <input type="text" id="signup-username" placeholder="Sign up username">
      <input type="text" id="signup-password" placeholder="Sign up password">
      <button id="signup-button">Sign Up</button>

      <br><br>

      <input type="text" id="login-username" placeholder="Login username">
      <input type="text" id="login-password" placeholder="Login password">
      <button id="login-button">Login</button>


      <h2>Update Note</h2>

      <input type="text" id="id-to-update" placeholder="ID to update">
      <br><br>

      <input type="text" id="update-title" placeholder="Update title">
      <br><br>

      <input type="text" id="update-content" placeholder="Update content">
      <br><br>

      <button id="update-note">Update</button>


      <h2>Delete Note</h2>

      <input type="text" id="delete-singular" placeholder="Delete note ID">
      <button id="delete-singular-button">Delete Note</button>

      <br><br>

      <button id="delete-all-notes">Delete All Notes</button>

    </div>

  </div>


  <!-- BOTTOM CENTER -->
  <div style="text-align: center; margin-top: 30px;">

    <button id="previous-page">Previous</button>
    <button id="next-page">Next</button>

  </div>


  <script src="client.js"></script>

</body>
</html>
